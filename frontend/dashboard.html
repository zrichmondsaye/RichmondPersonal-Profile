<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Optional custom styling for scrollability on mobile tables */
        .table-container {
            overflow-x: auto;
        }
        /* Custom styles for the delete button animation */
        .delete-btn {
            transition: all 0.15s ease-in-out;
        }
        .delete-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.3);
        }
        /* Style for the custom modal backdrop */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.6);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#3b82f6', /* blue-500 */
                        'danger': '#ef4444',  /* red-500 */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen p-4 sm:p-8">
    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-2xl p-6 sm:p-10">
        <h1 class="text-4xl font-extrabold text-gray-800 text-center mb-8 border-b pb-4">
            Admin Dashboard
        </h1>
        
        <!-- Status Message Area -->
        <div id="statusMessage" class="info-message text-center p-3 mb-6 rounded-lg font-medium"></div>

        <!-- Table Container for Responsive Scroll -->
        <div class="table-container shadow-lg rounded-lg border border-gray-200">
            <table id="messageTable" class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider md:px-6">Name</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider md:px-6">Email</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider md:px-6">Subject</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider md:px-6">Message</th>
                        <th scope="col" class="px-4 py-3 text-center text-xs font-bold text-gray-600 uppercase tracking-wider md:px-6">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <!-- Data will be populated here by JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="controls text-center mt-8">
            <button id="refreshBtn" class="px-6 py-3 bg-primary text-white font-semibold rounded-full shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition ease-in-out duration-150">
                Refresh Data
            </button>
        </div>
    </div>

    <script>
        // NOTE: Uses relative path so it seamlessly works locally and in production
        const BASE_URL = '';
        
        const tableBody = document.querySelector('#messageTable tbody');
        const refreshBtn = document.getElementById('refreshBtn');
        const statusMessageDiv = document.getElementById('statusMessage');

        // Custom modal replacement for alert() and confirm() using Tailwind classes
        const showModal = (message, isConfirm = false) => {
            return new Promise(resolve => {
                const modalDiv = document.createElement('div');
                modalDiv.className = 'modal-backdrop fixed inset-0 flex items-center justify-center z-50 transition-opacity duration-300 ease-out';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full transform transition-all duration-300 ease-out scale-95';
                contentDiv.innerHTML = `<p class="text-gray-700 text-lg mb-6">${message}</p>`;

                const buttonContainer = document.createElement('div');
                buttonContainer.className = 'flex justify-end space-x-3';

                const closeModal = (result) => {
                    modalDiv.classList.remove('opacity-100');
                    modalDiv.classList.add('opacity-0');
                    setTimeout(() => {
                        document.body.removeChild(modalDiv);
                        resolve(result);
                    }, 300);
                };

                const createButton = (text, onClick, isPrimary = false) => {
                    const btn = document.createElement('button');
                    btn.textContent = text;
                    btn.className = `px-4 py-2 font-semibold rounded-lg transition ease-in-out duration-150 ${
                        isPrimary 
                        ? 'bg-primary text-white hover:bg-blue-600 shadow-md' 
                        : 'bg-gray-200 text-gray-800 hover:bg-gray-300'
                    }`;
                    btn.onclick = onClick;
                    return btn;
                };

                if (isConfirm) {
                    buttonContainer.appendChild(createButton('Cancel', () => closeModal(false)));
                    buttonContainer.appendChild(createButton('Delete', () => closeModal(true), true));
                } else {
                    buttonContainer.appendChild(createButton('OK', () => closeModal(true), true));
                }

                contentDiv.appendChild(buttonContainer);
                modalDiv.appendChild(contentDiv);
                document.body.appendChild(modalDiv);

                // Start transition
                setTimeout(() => modalDiv.classList.add('opacity-100'), 10);
            });
        };

        // Function to update the status message box with Tailwind classes
        const setStatusMessage = (text, type = 'info') => {
            statusMessageDiv.textContent = text;
            statusMessageDiv.classList.remove('bg-yellow-100', 'text-yellow-700', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'hidden');
            
            if (text === '') {
                statusMessageDiv.classList.add('hidden');
                return;
            }

            if (type === 'error') {
                statusMessageDiv.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                statusMessageDiv.classList.add('bg-green-100', 'text-green-700');
            } else { // info/loading
                statusMessageDiv.classList.add('bg-yellow-100', 'text-yellow-700');
            }
        }


        // Function to fetch data from the backend
        const fetchMessages = async () => {
            setStatusMessage('Loading messages...', 'info');
            tableBody.innerHTML = '';
            try {
                const response = await fetch(`${BASE_URL}/api/dashboard`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const messages = await response.json();
                renderMessages(messages);
                setStatusMessage(''); // Clear message on success
            } catch (error) {
                console.error('Error fetching dashboard data:', error);
                setStatusMessage('Failed to load messages. Please check your server connection.', 'error');
            }
        };

        // Function to render messages into the table
        const renderMessages = (messages) => {
            tableBody.innerHTML = ''; // Clear existing data
            if (messages.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">No messages found.</td></tr>';
                return;
            }
            
            messages.forEach((msg, index) => {
                // Apply alternating background colors for stripes
                const rowClass = index % 2 === 0 ? 'bg-white hover:bg-gray-50' : 'bg-gray-50 hover:bg-gray-100';
                
                const row = document.createElement('tr');
                row.className = rowClass;
                row.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900 md:px-6">${msg.name}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 md:px-6">${msg.email}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 md:px-6">${msg.subject}</td>
                    <td class="px-4 py-3 text-sm text-gray-500 max-w-xs truncate md:whitespace-normal md:max-w-none md:px-6">${msg.message}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-center md:px-6">
                        <!-- Use msg.id as the data-id for deletion -->
                        <button class="delete-btn px-4 py-2 text-white bg-danger rounded-lg shadow-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50" 
                                data-id="${msg.id}">
                            Delete
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        };

        // Function to handle message deletion
        const deleteMessage = async (id) => {
            const deleteConfirmed = await showModal('Are you sure you want to delete this message?', true);
            
            if (deleteConfirmed) {
                setStatusMessage(`Deleting message ID: ${id}...`, 'info');
                try {
                    // Use the message ID in the delete endpoint
                    const response = await fetch(`${BASE_URL}/api/dashboard/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (!response.ok) {
                        const errorBody = await response.json().catch(() => ({ error: 'Unknown deletion error.' }));
                        throw new Error(errorBody.error || `HTTP error! status: ${response.status}`);
                    }
                    
                    // Refresh the messages after successful deletion
                    fetchMessages();
                    setStatusMessage('Message deleted successfully.', 'success');
                } catch (error) {
                    console.error('Error deleting message:', error);
                    setStatusMessage(`Failed to delete message. ${error.message}`, 'error');
                }
            } else {
                setStatusMessage('Deletion cancelled.', 'info');
            }
        };

        // Event listener for the refresh button
        refreshBtn.addEventListener('click', fetchMessages);

        // Event delegation for delete buttons
        tableBody.addEventListener('click', (event) => {
            if (event.target.classList.contains('delete-btn')) {
                // Get the unique ID from the data attribute
                const messageId = event.target.dataset.id;
                deleteMessage(messageId);
            }
        });
        
        // Initial data fetch
        fetchMessages();
    </script>
</body>
</html>
